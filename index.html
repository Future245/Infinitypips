<script>
const panel=document.querySelector('#panel');let key='';const icon=t=>t==='settings'?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 13.5l1.4 1.1-1.8 3.1-1.7-.6a7.6 7.6 0 0 1-2.1 1.2l-.3 1.9H9.5l-.3-1.9a7.6 7.6 0 0 1-2.1-1.2l-1.7.6-1.8-3.1L5 13.5a7 7 0 0 1 0-3L3.6 9.4l1.8-3.1 1.7.6a7.6 7.6 0 0 1 2.1-1.2l.3-1.9h3.6l.3 1.9a7.6 7.6 0 0 1 2.1 1.2l1.7-.6L19 9.4l-1.4 1.1a7 7 0 0 1 0 3Z"/></svg>':'<svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="13" rx="3"/><path d="M12 7V3m-2 0h4M8 12h.1M16 12h.1M9 16h6M5 13H2m20 0h-3"/></svg>';
function home(){var derivConnected=!!sessionStorage.getItem('deriv_access_token');panel.innerHTML=`<div class="heading"><span class="num">01</span><div><strong>License</strong><small>Unlock your automated edge</small></div><i class="dot"></i></div><button class="card settings" id="settings"><span class="icon">${icon('settings')}</span><span class="copy"><strong>Settings</strong><small>Manage your license key</small></span><span class="arrow"><svg viewBox="0 0 20 20"><path d="M7 13 13 7M9 7h4v4"/></svg></span></button><div class="status"><span></span>License not activated</div><div class="heading"><span class="num">02</span><div><strong>Infinity Pips</strong><small>Your trading command center</small></div><i class="dot cyan"></i></div><button class="card robot" id="robot"><span class="icon">${icon('robot')}</span><span class="copy"><strong>Access Robot</strong><small>Launch your trading workspace</small></span><span class="arrow"><svg viewBox="0 0 20 20"><path d="M7 13 13 7M9 7h4v4"/></svg></span></button><div class="status${derivConnected?' connected':''}" id="derivStatus"><span></span>${derivConnected?'Deriv account connected':'Checking Deriv account…'}</div>`;document.querySelector('#settings').onclick=settings;var robotBtn=document.querySelector('#robot');robotBtn.onclick=function(){var liveToken=sessionStorage.getItem('deriv_access_token');if(liveToken){window.location.href='/Ariana.html';return;}robotBtn.disabled=true;fetch('/.netlify/functions/session-status',{credentials:'include'}).then(function(r){return r.json();}).then(function(data){robotBtn.disabled=false;if(data&&data.registered){startDerivLogin('robot').catch(function(err){console.error('Silent Deriv reconnect failed:',err);alert('Could not reconnect to Deriv. Please try again.');});}else{alert('Connect your Deriv account first to launch the robot.');settings();}}).catch(function(err){robotBtn.disabled=false;console.error('Session check failed:',err);alert('Could not verify your account right now. Please try again.');})};if(!derivConnected){fetch('/.netlify/functions/session-status',{credentials:'include'}).then(function(r){return r.json();}).then(function(data){var pill=document.querySelector('#derivStatus');if(!pill)return;if(data&&data.registered){pill.className='status connected';pill.innerHTML='<span></span>Deriv linked — tap Access Robot to resume';}else{pill.className='status';pill.innerHTML='<span></span>Deriv account not connected';}}).catch(function(){var pill=document.querySelector('#derivStatus');if(pill){pill.className='status';pill.innerHTML='<span></span>Deriv account not connected';}});}}function settings(){panel.innerHTML=`<div class="settings-view"><button class="back" id="back"><svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg>Back to dashboard</button><div class="heading"><span class="num">01</span><div><strong>Activate license</strong><small>Connect your Infinity Pips account</small></div></div><label class="label" for="key">Serial key</label><div class="input-wrap"><svg viewBox="0 0 20 20"><path d="M8 12a4 4 0 1 1 3.46-2H18v2h-1.5v2H14v-2h-2.54A4 4 0 0 1 8 12Z"/><circle cx="6" cy="12" r="1.4"/></svg><input id="key" placeholder="IPR-XXXX-XXXX-XXXX" autocomplete="off"></div><button class="activate" id="activate"><span>Activate license</span><svg viewBox="0 0 20 20"><path d="M4 10h11M10 5l5 5-5 5"/></svg></button><p class="helper"><svg viewBox="0 0 20 20"><path d="M10 2 3 5.5v4c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5v-4L10 2Z"/><path d="m7.3 10 1.9 1.9 3.8-3.9"/></svg>Paste the key from your license email.</p></div>`;document.querySelector('#back').onclick=home;document.querySelector('#activate').onclick=()=>{key=document.querySelector('#key').value.trim();if(key){portal()}else document.querySelector('#key').focus()}}function portal(){var derivConnected=!!sessionStorage.getItem('deriv_access_token');panel.innerHTML=`<div class="portal-view"><button class="portal-back" id="portalBack"><svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg>Back</button><div class="portal-kicker">Infinity Pips access gateway</div><h2 class="portal-title">Client Portal</h2><p class="portal-subtitle">Verify ownership of your Deriv account to unlock your trading workspace.</p><div class="portal-card"><button class="connect" id="connect"><span class="connect-badge"><svg viewBox="0 0 20 20"><path d="M12 3 5 5v6c0 4.2 2.9 8 7 9.5 4.1-1.5 7-5.3 7-9.5V5l-7-2Z"/><path d="m8.8 12 2.1 2.1 4.4-4.5"/></svg></span><span class="connect-label" id="connectLabel">${derivConnected?'Reconnect Deriv account':'Connect Deriv account'}</span><span class="connect-arrow"><svg viewBox="0 0 20 20"><path d="M4 10h11M10 5l5 5-5 5"/></svg></span></button><p class="portal-note">You&apos;ll be redirected to Deriv to sign in — your password is never shared with this app.</p><div class="connection-status${derivConnected?' connected':''}" id="connectionStatus"><span></span>${derivConnected?'Account Connected':'Checking…'}</div></div></div>`;document.querySelector('#portalBack').onclick=settings;document.querySelector('#connect').onclick=function(){var btn=document.querySelector('#connect');var status=document.querySelector('#connectionStatus');btn.disabled=true;status.className='connection-status';status.innerHTML='<span></span>Connecting…';startDerivLogin('portal').catch(function(err){console.error('Deriv login failed to start:',err);btn.disabled=false;status.innerHTML='<span style="border-color:#ff4d5e;box-shadow:0 0 12px #ff4d5e"></span>Could not start login — try again';})};if(!derivConnected){fetch('/.netlify/functions/session-status',{credentials:'include'}).then(function(r){return r.json();}).then(function(data){var pill=document.querySelector('#connectionStatus');var label=document.querySelector('#connectLabel');if(!pill)return;if(data&&data.registered){pill.className='connection-status connected';pill.innerHTML='<span></span>Account Connected';if(label)label.textContent='Reconnect Deriv account';}else{pill.className='connection-status';pill.innerHTML='<span></span>Not connected';if(label)label.textContent='Connect Deriv account';}}).catch(function(){var pill=document.querySelector('#connectionStatus');if(pill){pill.className='connection-status';pill.innerHTML='<span></span>Not connected';}});}}
function initialRoute(){var params=new URLSearchParams(window.location.search);var justConnected=params.get('deriv_connected')==='1';if(justConnected){history.replaceState(null,'',window.location.pathname+window.location.hash);portal();}else{home();}}
initialRoute();

/* ===== Deriv OAuth2 (Authorization Code + PKCE) ===== */
(function(){
  var DERIV_CLIENT_ID = '34s6rrHpvnegnGSg5mrWW';
  var DERIV_REDIRECT_URI = 'https://infinitypips.netlify.app/callback';
  var DERIV_SCOPES = 'trade account_manage';
  var DERIV_AUTH_URL = 'https://auth.deriv.com/oauth2/auth';

  function randomString(len){
    var arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    var out = '';
    for (var i = 0; i < arr.length; i++){ out += chars[arr[i] % chars.length]; }
    return out;
  }

  function base64UrlEncode(buffer){
    var bytes = new Uint8Array(buffer);
    var binary = '';
    for (var i = 0; i < bytes.length; i++){ binary += String.fromCharCode(bytes[i]); }
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function generateCodeChallenge(verifier){
    var digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return base64UrlEncode(digest);
  }

  window.startDerivLogin = async function startDerivLogin(postAuthTarget){
    var codeVerifier = randomString(64);
    var codeChallenge = await generateCodeChallenge(codeVerifier);
    var state = randomString(32);

    sessionStorage.setItem('deriv_code_verifier', codeVerifier);
    sessionStorage.setItem('deriv_oauth_state', state);
    sessionStorage.setItem('deriv_post_auth_target', postAuthTarget === 'robot' ? 'robot' : 'portal');

    var params = new URLSearchParams({
      response_type: 'code',
      client_id: DERIV_CLIENT_ID,
      redirect_uri: DERIV_REDIRECT_URI,
      scope: DERIV_SCOPES,
      state: state,
      code_challenge: codeChallenge,
      code_challenge_method: 'S256'
    });

    window.location.href = DERIV_AUTH_URL + '?' + params.toString();
  };
})();
</script></body></html>
