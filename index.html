const panel=document.querySelector('#panel');let key='';const icon=t=>t==='settings'?'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19 13.5l1.4 1.1-1.8 3.1-1.7-.6a7.6 7.6 0 0 1-2.1 1.2l-.3 1.9H9.5l-.3-1.9a7.6 7.6 0 0 1-2.1-1.2l-1.7.6-1.8-3.1L5 13.5a7 7 0 0 1 0-3L3.6 9.4l1.8-3.1 1.7.6a7.6 7.6 0 0 1 2.1-1.2l.3-1.9h3.6l.3 1.9a7.6 7.6 0 0 1 2.1 1.2l1.7-.6L19 9.4l-1.4 1.1a7 7 0 0 1 0 3Z"/></svg>':'<svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="13" rx="3"/><path d="M12 7V3m-2 0h4M8 12h.1M16 12h.1M9 16h6M5 13H2m20 0h-3"/></svg>';
function home(){var derivConnected=!!sessionStorage.getItem('deriv_access_token');panel.innerHTML=`<div class="heading"><span class="num">01</span><div><strong>License</strong><small>Unlock your automated edge</small></div><i class="dot"></i></div><button class="card settings" id="settings"><span class="icon">${icon('settings')}</span><span class="copy"><strong>Settings</strong><small>Manage your license key</small></span><span class="arrow"><svg viewBox="0 0 20 20"><path d="M7 13 13 7M9 7h4v4"/></svg></span></button><div class="status"><span></span>License not activated</div><div class="heading"><span class="num">02</span><div><strong>Infinity Pips</strong><small>Your trading command center</small></div><i class="dot cyan"></i></div><button class="card robot" id="robot"><span class="icon">${icon('robot')}</span><span class="copy"><strong>Access Robot</strong><small>Launch your trading workspace</small></span><span class="arrow"><svg viewBox="0 0 20 20"><path d="M7 13 13 7M9 7h4v4"/></svg></span></button><div class="status${derivConnected?' connected':''}" id="derivStatus"><span></span>${derivConnected?'Deriv account connected':'Checking Deriv account…'}</div>`;document.querySelector('#settings').onclick=settings;var robotBtn=document.querySelector('#robot');robotBtn.onclick=function(){var haveAll=[1,2,3,4,5,6,7,8].every(function(n){return sessionStorage.getItem('deriv_access_token_'+n)||(n===1&&sessionStorage.getItem('deriv_access_token'));});if(haveAll){window.location.href='/Ariana.html';return;}robotBtn.disabled=true;fetch('/.netlify/functions/session-status',{credentials:'include'}).then(function(r){return r.json();}).then(function(data){robotBtn.disabled=false;if(data&&data.registered){sessionStorage.setItem('auto_chain','1');sessionStorage.setItem('auto_target','robot');portal();}else{alert('Connect your Deriv account first to launch the robot.');settings();}}).catch(function(err){robotBtn.disabled=false;console.error('Session check failed:',err);alert('Could not verify your account right now. Please try again.');})};if(!derivConnected){fetch('/.netlify/functions/session-status',{credentials:'include'}).then(function(r){return r.json();}).then(function(data){var pill=document.querySelector('#derivStatus');if(!pill)return;if(data&&data.registered){pill.className='status connected';pill.innerHTML='<span></span>Deriv linked — tap Access Robot to resume';}else{pill.className='status';pill.innerHTML='<span></span>Deriv account not connected';}}).catch(function(){var pill=document.querySelector('#derivStatus');if(pill){pill.className='status';pill.innerHTML='<span></span>Deriv account not connected';}});}}function settings(){panel.innerHTML=`<div class="settings-view"><button class="back" id="back"><svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg>Back to dashboard</button><div class="heading"><span class="num">01</span><div><strong>Activate license</strong><small>Connect your Infinity Pips account</small></div></div><label class="label" for="key">Serial key</label><div class="input-wrap"><svg viewBox="0 0 20 20"><path d="M8 12a4 4 0 1 1 3.46-2H18v2h-1.5v2H14v-2h-2.54A4 4 0 0 1 8 12Z"/><circle cx="6" cy="12" r="1.4"/></svg><input id="key" placeholder="XXXX-XXXX-XXXX" maxlength="14" autocomplete="off"></div><p class="key-error" id="keyError" aria-live="polite"></p><button class="activate" id="activate"><span>Activate license</span><svg viewBox="0 0 20 20"><path d="M4 10h11M10 5l5 5-5 5"/></svg></button><p class="helper"><svg viewBox="0 0 20 20"><path d="M10 2 3 5.5v4c0 4.4 3 8.3 7 9.5 4-1.2 7-5.1 7-9.5v-4L10 2Z"/><path d="m7.3 10 1.9 1.9 3.8-3.9"/></svg>Paste the key from your license email.</p></div>`;document.querySelector('#back').onclick=home;document.querySelector('#activate').onclick=async()=>{key=document.querySelector('#key').value.trim();var input=document.querySelector('#key');var btn=document.querySelector('#activate');var errEl=document.querySelector('#keyError');var label=btn.querySelector('span');var labelText=label?label.textContent:'';if(errEl)errEl.textContent='';if(!key){input.focus();return}if(!/^\d{4}-\d{4}-\d{4}$/.test(key)){if(errEl)errEl.textContent='Enter your key as XXXX-XXXX-XXXX.';return}btn.disabled=true;if(label)label.textContent='Verifying…';try{var res=await fetch('/.netlify/functions/verify-serial-key',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})});var data=await res.json().catch(function(){return{}});if(res.ok&&data&&data.authorized){portal()}else{if(errEl)errEl.textContent='That serial key is not valid. Check it and try again.';btn.disabled=false;if(label)label.textContent=labelText}}catch(err){console.error('Serial key verification failed:',err);if(errEl)errEl.textContent='Could not verify your key right now. Please try again.';btn.disabled=false;if(label)label.textContent=labelText}}}function portal(){panel.innerHTML='<div class="portal-view"><p class="helper" style="margin:40px auto">Verifying access…</p></div>';fetch('/.netlify/functions/portal-status',{credentials:'include'}).then(function(r){return r.json()}).then(function(data){if(data&&data.authorized){renderPortal()}else{settings()}}).catch(function(err){console.error('Portal authorization check failed:',err);settings()})}function renderPortal(){
var SLOT_COUNT=8;
var CHECK_SVG='<svg viewBox="0 0 20 20"><path d="m5 10.5 3.2 3.2L15 6.8"/></svg>',LOCK_SVG='<svg viewBox="0 0 20 20"><rect x="4.5" y="9" width="11" height="7.5" rx="2"/><path d="M7 9V6.8a3 3 0 0 1 6 0V9"/></svg>';
function slotToken(n){return sessionStorage.getItem('deriv_access_token_'+n)||(n===1?sessionStorage.getItem('deriv_access_token'):null);}
panel.innerHTML='<div class="portal-view"><button class="portal-back" id="portalBack"><svg viewBox="0 0 20 20"><path d="M12 4 6 10l6 6"/></svg>Back</button><div class="portal-kicker">Infinity Pips access gateway</div><h2 class="portal-title">Client Portal</h2><p class="portal-subtitle">Connect your eight Deriv apps, one after another, to unlock your trading workspace.</p><div class="portal-card"><ol class="slot-list" id="slotList"></ol><div id="slotAction"></div><p class="portal-note">You&apos;ll be redirected to Deriv to sign in — your password is never shared with this app. Use the same Deriv account for all eight apps.</p><div class="connection-status" id="connectionStatus"><span></span>Checking…</div></div></div>';
document.querySelector('#portalBack').onclick=settings;
function paint(server,failed){
var list=document.querySelector('#slotList'),action=document.querySelector('#slotAction'),pill=document.querySelector('#connectionStatus');
if(!list||!action||!pill)return;
var rows='',readyCount=0,active=0,activeServerOk=false,i;
for(i=1;i<=SLOT_COUNT;i++){
var serverOk=!!(server&&server.slots&&server.slots[i-1]&&server.slots[i-1].status==='connected');
var ready=(serverOk||i>4)&&!!slotToken(i);
var state,text;
if(!active&&ready){state='done';text='Connected';readyCount++;}
else if(!active){active=i;activeServerOk=serverOk;state='active';text=serverOk?'Session expired — reconnect':'Ready to connect';}
else{state='locked';text='Waits for App '+(i-1);}
rows+='<li class="slot-row '+state+'"><span class="slot-num" aria-hidden="true">'+(state==='done'?CHECK_SVG:(state==='locked'?LOCK_SVG:i))+'</span><span class="slot-info"><strong>App '+i+'</strong><small>'+text+'</small></span></li>';
}
list.innerHTML=rows;
if(active){
action.innerHTML='<button class="connect" id="connect"><span class="connect-badge"><svg viewBox="0 0 20 20"><path d="M12 3 5 5v6c0 4.2 2.9 8 7 9.5 4.1-1.5 7-5.3 7-9.5V5l-7-2Z"/><path d="m8.8 12 2.1 2.1 4.4-4.5"/></svg></span><span class="connect-label">'+(activeServerOk?'Reconnect':'Connect')+' App '+active+'</span><span class="connect-arrow"><svg viewBox="0 0 20 20"><path d="M4 10h11M10 5l5 5-5 5"/></svg></span></button>';
if(readyCount>=4){var sk=document.createElement('button');sk.id='skipNuclear';sk.type='button';sk.textContent='Open robot with '+readyCount+' apps';sk.style.cssText='margin-top:10px;width:100%;padding:12px;border-radius:14px;border:1px solid #ffffff22;background:#ffffff0a;color:#b8cdec;font:600 .85rem Inter,sans-serif;cursor:pointer';sk.onclick=function(){['auto_chain','auto_target'].forEach(function(k){sessionStorage.removeItem(k);});window.location.href='/Ariana.html';};action.appendChild(sk);}
document.querySelector('#connect').onclick=function(){var btn=document.querySelector('#connect');btn.disabled=true;sessionStorage.setItem('auto_chain','1');pill.className='connection-status';pill.innerHTML='<span></span>Connecting App '+active+'…';startDerivLogin('portal',active).catch(function(err){console.error('Deriv login failed to start:',err);btn.disabled=false;pill.innerHTML='<span style="border-color:#ff4d5e;box-shadow:0 0 12px #ff4d5e"></span>Could not start login — try again';});};
}else{
action.innerHTML='<div class="slot-done"><span class="slot-done-badge">'+CHECK_SVG+'</span><p>All '+SLOT_COUNT+' apps are connected. Go back and tap Access Robot to open the bot.</p></div>';
}
/* Auto-reconnect: the account is already known to the database (server says this app was connected, or we are mid-chain), so go straight to Deriv for the next app. Each app is tried at most twice per browser session so a failure can never loop. */
var chain=sessionStorage.getItem('auto_chain')==='1';
if(readyCount===SLOT_COUNT){
var tgt=sessionStorage.getItem('auto_target');
['auto_chain','auto_target'].forEach(function(k){sessionStorage.removeItem(k);});
for(i=1;i<=SLOT_COUNT;i++)sessionStorage.removeItem('auto_try_'+i);
if(tgt==='robot'&&!failed){pill.className='connection-status connected';pill.innerHTML='<span></span>All '+SLOT_COUNT+' apps connected — opening robot…';setTimeout(function(){window.location.href='/Ariana.html';},700);return;}
}else if(active&&!failed&&server&&server.registered&&(activeServerOk||chain)){
var tries=Number(sessionStorage.getItem('auto_try_'+active)||0);
if(tries<2){
sessionStorage.setItem('auto_try_'+active,String(tries+1));
sessionStorage.setItem('auto_chain','1');
var abtn=document.querySelector('#connect');if(abtn)abtn.disabled=true;
pill.className='connection-status';pill.innerHTML='<span></span>Reconnecting App '+active+' automatically…';
setTimeout(function(){startDerivLogin('portal',active).catch(function(err){console.error('Auto reconnect failed to start:',err);if(abtn)abtn.disabled=false;pill.innerHTML='<span style="border-color:#ff4d5e;box-shadow:0 0 12px #ff4d5e"></span>Could not start login — tap Connect';});},900);
return;
}else{sessionStorage.removeItem('auto_chain');sessionStorage.removeItem('auto_target');}
}
if(failed){pill.className='connection-status';pill.innerHTML='<span style="border-color:#ff4d5e;box-shadow:0 0 12px #ff4d5e"></span>Could not check status — try again';}
else{pill.className='connection-status'+(readyCount===SLOT_COUNT?' connected':'');pill.innerHTML='<span></span>'+(readyCount===SLOT_COUNT?'All '+SLOT_COUNT+' apps connected':readyCount+' of '+SLOT_COUNT+' apps connected');}
}
fetch('/.netlify/functions/connections-status',{credentials:'include',cache:'no-store'}).then(function(r){return r.json();}).then(function(data){if(data&&data.slots){paint(data,false);}else{paint(null,true);}}).catch(function(err){console.error('Connection status check failed:',err);paint(null,true);});
}
function initialRoute(){var params=new URLSearchParams(window.location.search);var justConnected=params.get('deriv_connected')==='1';if(justConnected){history.replaceState(null,'',window.location.pathname+window.location.hash);portal();}else{home();}}
initialRoute();

/* ===== Deriv OAuth2 (Authorization Code + PKCE) ===== */
(function(){
  // The four separate Deriv apps ("slots"). App IDs are public identifiers.
  // Slot 1 = Ladysmith, slots 2-8 = BotConnection2-8 (Deriv dashboard).
  // All four use the same redirect URL, so the slot travels inside `state`.
  var DERIV_APP_IDS = {
    1: '34s6rrHpvnegnGSg5mrWW',
    2: '34DXFFxPkpfaQhw3SxhpV',
    3: '34DXGX2q8cy9AkfkmJwMd',
    4: '34DXHBrL4WVOxFx3lqT8l',
    5: '34FLWa3gCXyD9X0RbLD22',
    6: '34FLWIyzaPAWloojlpjM5',
    7: '34FMBLsAZ13c3Y9HTqGUg',
    8: '34FMCpVPHFnmxapXWWjWs'
  };
  var DERIV_REDIRECT_URI = 'https://infinitypips.netlify.app/callback';
  var DERIV_SCOPES = 'trade account_manage';
  var DERIV_AUTH_URL = 'https://auth.deriv.com/oauth2/auth';

  function randomString(len){
    var arr = new Uint8Array(len);
    crypto.getRandomValues(arr);
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    var out = '';
    for (var i = 0; i < arr.length; i++){ out += chars[arr[i] % chars.length]; }
    return out;
  }

  function base64UrlEncode(buffer){
    var bytes = new Uint8Array(buffer);
    var binary = '';
    for (var i = 0; i < bytes.length; i++){ binary += String.fromCharCode(bytes[i]); }
    return btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }

  async function generateCodeChallenge(verifier){
    var digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
    return base64UrlEncode(digest);
  }

  window.startDerivLogin = async function startDerivLogin(postAuthTarget, slot){
    slot = Number(slot) || 1;
    if (!DERIV_APP_IDS[slot]){ throw new Error('Unknown app slot: ' + slot); }
    var codeVerifier = randomString(64);
    var codeChallenge = await generateCodeChallenge(codeVerifier);
    var state = 's' + slot + '.' + randomString(32);

    sessionStorage.setItem('deriv_code_verifier_' + slot, codeVerifier);
    sessionStorage.setItem('deriv_oauth_state_' + slot, state);
    sessionStorage.setItem('deriv_post_auth_target', postAuthTarget === 'robot' ? 'robot' : 'portal');

    var params = new URLSearchParams({
      response_type: 'code',
      client_id: DERIV_APP_IDS[slot],
      redirect_uri: DERIV_REDIRECT_URI,
      scope: DERIV_SCOPES,
      state: state,
      code_challenge: codeChallenge,
      code_challenge_method: 'S256'
    });

    window.location.href = DERIV_AUTH_URL + '?' + params.toString();
  };
})();
