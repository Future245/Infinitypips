<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connecting to Deriv…</title>
<style>
  :root{ box-sizing:border-box; }
  *{ box-sizing:inherit; margin:0; padding:0; }
  body{
    font-family:-apple-system, 'Inter', sans-serif;
    background:#05030c;
    color:#f3eefc;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .box{ max-width:420px; }
  h1{ font-size:20px; margin-bottom:12px; font-weight:700; }
  p{ color:#a996d6; font-size:14px; line-height:1.5; }
  .spinner{
    width:36px; height:36px;
    border:3px solid #3a2a63;
    border-top-color:#3ad4ff;
    border-radius:50%;
    margin:0 auto 20px;
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  h1.error{ color:#ff3b57; }
  a.btn{
    display:inline-block;
    margin-top:18px;
    padding:10px 22px;
    background:#160f2e;
    border:1px solid #3ad4ff;
    color:#d8f6ff;
    border-radius:10px;
    text-decoration:none;
    font-weight:600;
  }
</style>
</head>
<body>

<div class="box" id="box">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Connecting your Deriv account…</h1>
  <p id="message">Please wait while we finish signing you in.</p>
</div>

<script>
(function(){
  var box = document.getElementById('box');
  var spinner = document.getElementById('spinner');
  var title = document.getElementById('title');
  var message = document.getElementById('message');

  function showError(msg){
    spinner.style.display = 'none';
    title.textContent = 'Login failed';
    title.className = 'error';
    message.textContent = msg;
    var link = document.createElement('a');
    link.className = 'btn';
    link.href = '/';
    link.textContent = 'Back to app';
    box.appendChild(link);
  }

  function showSuccess(slot){
    spinner.style.display = 'none';
    title.textContent = slot > 1 ? 'App ' + slot + ' connected!' : 'Connected!';
    message.textContent = 'Redirecting you back to the app…';
    var target = sessionStorage.getItem('deriv_post_auth_target') || 'portal';
    sessionStorage.removeItem('deriv_post_auth_target');
    var destination = target === 'robot' ? '/Ariana.html' : '/';
    setTimeout(function(){ window.location.href = destination + '?deriv_connected=1&slot=' + slot; }, 1200);
  }

  var params = new URLSearchParams(window.location.search);
  var error = params.get('error');
  var code = params.get('code');
  var state = params.get('state');

  if (error){
    showError(params.get('error_description') || error);
    return;
  }

  if (!code || !state){
    showError('Missing authorization code from Deriv.');
    return;
  }

  // The login was started for one of four separate Deriv apps ("slots").
  // The slot travels inside `state` (e.g. "s2.<random>") because all four
  // apps share this one callback URL. Each slot keeps its own state,
  // verifier and token, so finishing one app never overwrites another.
  var slotMatch = /^s([1-8])\./.exec(state);
  if (!slotMatch){
    showError('Security check failed (unknown app). Please try logging in again.');
    return;
  }
  var slot = Number(slotMatch[1]);

  var storedState = sessionStorage.getItem('deriv_oauth_state_' + slot);
  var codeVerifier = sessionStorage.getItem('deriv_code_verifier_' + slot);

  if (!storedState || state !== storedState){
    showError('Security check failed (state mismatch). Please try logging in again.');
    return;
  }

  if (!codeVerifier){
    showError('Your login session expired. Please try logging in again.');
    return;
  }

  // The actual code-for-token exchange must happen server-side (Deriv's own
  // docs are explicit about this), so we hand it off to a Netlify Function
  // rather than calling Deriv's token endpoint directly from this page.
  fetch('/.netlify/functions/deriv-token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: code,
      code_verifier: codeVerifier,
      redirect_uri: window.location.origin + '/callback',
      slot: slot
    })
  })
  .then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(data){
      return { ok: res.ok, status: res.status, data: data };
    });
  })
  .then(function(result){
    sessionStorage.removeItem('deriv_oauth_state_' + slot);
    sessionStorage.removeItem('deriv_code_verifier_' + slot);

    if (!result.ok){
      if (result.status === 403 && result.data && result.data.error === 'not_authorized'){
        showError('This Deriv account is not authorized to use this app.');
      } else if (result.status === 409 && result.data && result.data.error === 'account_conflict'){
        showError('This Deriv account is already linked to a different account here. Please use the account you originally connected with.');
      } else if (result.data && result.data.message){
        showError(result.data.message);
      } else {
        showError('Could not complete login (HTTP ' + result.status + '). Please try again.');
      }
      return;
    }

    if (result.data.access_token){
      // sessionStorage is the simplest place to hand the token to the rest
      // of the app. For a production trading tool, consider having the
      // function set it as a short-lived, httpOnly cookie instead.
      // One token per app slot. Slot 1 is also stored under the original
      // key so Ariana.html and the rest of the app keep working unchanged.
      sessionStorage.setItem('deriv_access_token_' + slot, result.data.access_token);
      if (slot === 1){ sessionStorage.setItem('deriv_access_token', result.data.access_token); }
      if (result.data.loginid){ sessionStorage.setItem('deriv_loginid', result.data.loginid); }
      showSuccess(slot);
    } else {
      showError('No access token returned.');
    }
  })
  .catch(function(err){
    console.error(err);
    showError(err && err.message ? err.message : 'Could not complete login. Please try again.');
  });
})();
</script>
</body>
</html>
