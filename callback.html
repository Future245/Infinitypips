<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02060f">
<title>Infinity Pips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    box-sizing:border-box; color-scheme:dark;
    --bg:#02060f; --ink:#f4f8ff; --ink2:#a9b8cf; --ink3:#6f7f98;
    --b1:#4da6ff; --b2:#9ee3ff; --b3:#2f6bff; --vio:#7a6bff; --mint:#34e0c0;
    --font-d:'Sora',-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    --font-m:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  }
  *{ box-sizing:inherit; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family:var(--font-d);
    background:var(--bg);
    color:var(--ink);
    min-height:100vh; min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; overflow:hidden; position:relative;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- backdrop (transform/opacity only: no flicker, no repaint churn) ---------- */
  .scene{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;
    background:
      radial-gradient(120% 70% at 50% -8%, #0c2146 0%, rgba(8,22,48,.0) 62%),
      radial-gradient(90% 60% at 50% 112%, #07163a 0%, rgba(2,6,15,0) 60%),
      var(--bg); }
  .aurora{ position:absolute; border-radius:50%; filter:blur(70px); opacity:.55; will-change:transform; }
  .aurora.a1{ width:76vmax; height:76vmax; left:-34vmax; top:-40vmax; background:radial-gradient(circle,rgba(47,107,255,.55),transparent 66%); }
  .aurora.a2{ width:70vmax; height:70vmax; right:-38vmax; top:6vmax;  background:radial-gradient(circle,rgba(122,107,255,.42),transparent 66%); }
  .aurora.a3{ width:64vmax; height:64vmax; left:-10vmax; bottom:-46vmax; background:radial-gradient(circle,rgba(52,224,192,.26),transparent 66%); }
  .floor{ position:absolute; left:-30%; right:-30%; bottom:-6%; height:58%;
    transform:perspective(520px) rotateX(64deg); transform-origin:50% 100%;
    -webkit-mask-image:linear-gradient(to top,#000 8%,transparent 86%); mask-image:linear-gradient(to top,#000 8%,transparent 86%); opacity:.55; }
  .floor i{ position:absolute; inset:0; will-change:transform;
    background-image:
      linear-gradient(rgba(120,190,255,.28) 1px,transparent 1px),
      linear-gradient(90deg,rgba(120,190,255,.22) 1px,transparent 1px);
    background-size:56px 56px; }
  .spark{ position:absolute; width:3px; height:3px; border-radius:50%; background:#cfeaff; box-shadow:0 0 10px 2px rgba(120,200,255,.8); opacity:0; will-change:transform,opacity; }
  .vignette{ position:absolute; inset:0; background:radial-gradient(120% 90% at 50% 45%,transparent 52%,rgba(0,0,0,.62) 100%); }

  /* ---------- content ---------- */
  .box{ position:relative; z-index:2; width:100%; max-width:380px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .brand{ display:flex; flex-direction:column; align-items:center; gap:12px; margin:2px 0 14px; }
  .brand .mark{ position:relative; width:50px; height:50px; border-radius:16px; display:grid; place-items:center; overflow:hidden;
    background:linear-gradient(145deg,rgba(158,227,255,.30),rgba(47,107,255,.16) 46%,rgba(8,20,48,.9));
    border:1px solid rgba(190,230,255,.55);
    box-shadow:0 0 0 4px rgba(77,166,255,.08), 0 10px 30px rgba(47,107,255,.45), 0 0 34px rgba(77,166,255,.35), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -10px 18px rgba(47,107,255,.25); }
  .brand .mark svg{ position:relative; width:30px; height:15px; fill:none; stroke:#fff; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 7px rgba(120,210,255,1)); }
  .brand .mark::after{ content:""; position:absolute; top:-20%; bottom:-20%; left:0; width:38%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent); transform:translateX(-140%) skewX(-20deg); }
  .brand .word{ display:flex; align-items:baseline; justify-content:center; gap:.5em; font:800 23px/1 var(--font-d); letter-spacing:.3em; text-transform:uppercase; padding-left:.3em; filter:drop-shadow(0 4px 18px rgba(47,107,255,.55)); }
  .brand .word b{ font-weight:800; background:linear-gradient(180deg,#ffffff 12%,#cfe6ff 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .brand .word i{ font-style:normal; font-weight:800; background:linear-gradient(180deg,#bfeaff 5%,#4da6ff 95%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .brand .tag{ display:flex; align-items:center; gap:12px; font:500 9.5px/1 var(--font-m); letter-spacing:.42em; text-transform:uppercase; color:var(--ink3); padding-left:.42em; }
  .brand .tag u{ display:block; width:34px; height:1px; background:linear-gradient(90deg,transparent,rgba(158,227,255,.65)); }
  .brand .tag u:last-child{ background:linear-gradient(90deg,rgba(158,227,255,.65),transparent); }

  .orb{ position:relative; width:176px; height:176px; display:grid; place-items:center; margin:2px 0 8px; }
  .orb .halo{ position:absolute; inset:-34%; border-radius:50%; background:radial-gradient(circle,rgba(77,166,255,.38) 0%,rgba(77,166,255,.12) 42%,transparent 70%); }
  .orb .ring{ position:absolute; inset:0; border-radius:50%; will-change:transform;
    background:conic-gradient(from 0deg,rgba(77,166,255,0) 0deg,rgba(77,166,255,.0) 40deg,var(--b1) 200deg,var(--b2) 300deg,rgba(158,227,255,0) 360deg);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px));
            mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 2.5px)); }
  .orb .ring.r2{ inset:16px; background:conic-gradient(from 180deg,rgba(122,107,255,0),rgba(122,107,255,0) 60deg,var(--vio) 220deg,#c4baff 320deg,rgba(196,186,255,0));
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px)); mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000 calc(100% - 1.5px)); }
  .orb .ticks{ position:absolute; inset:7px; border-radius:50%; border:1px dashed rgba(158,227,255,.28); will-change:transform; }
  .orb .sat{ position:absolute; inset:0; will-change:transform; }
  .orb .sat i{ position:absolute; left:50%; top:-4px; width:8px; height:8px; margin-left:-4px; border-radius:50%; background:#fff; box-shadow:0 0 12px 3px rgba(120,210,255,.95); }
  .orb .sat.s2{ inset:16px; } .orb .sat.s2 i{ background:#d8d1ff; box-shadow:0 0 12px 3px rgba(150,130,255,.9); width:6px; height:6px; margin-left:-3px; top:-3px; }
  .orb .core{ position:relative; width:104px; height:104px; border-radius:50%; display:grid; place-items:center;
    background:radial-gradient(circle at 34% 28%,rgba(160,215,255,.22),rgba(14,34,74,.9) 58%,rgba(4,12,30,.96) 100%);
    border:1px solid rgba(158,227,255,.34);
    box-shadow:0 0 38px rgba(77,166,255,.38), inset 0 0 26px rgba(77,166,255,.28), inset 0 1px 0 rgba(255,255,255,.18); }
  .orb .core svg{ width:62px; height:31px; overflow:visible; }
  .orb .core .base{ fill:none; stroke:rgba(158,227,255,.28); stroke-width:3; stroke-linecap:round; }
  .orb .core .flow{ fill:none; stroke:url(#flowg); stroke-width:3.4; stroke-linecap:round; stroke-dasharray:46 154; filter:drop-shadow(0 0 7px rgba(120,210,255,1)); }

  h1{ font:800 25px/1.2 var(--font-d); letter-spacing:-.02em; background:linear-gradient(180deg,#fff 0%,#cfe6ff 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; padding:0 6px; }
  p{ color:var(--ink2); font-size:14.5px; line-height:1.65; max-width:320px; }

  .steps{ display:flex; align-items:center; justify-content:center; gap:0; width:100%; margin-top:4px; }
  .st{ display:flex; flex-direction:column; align-items:center; gap:8px; width:84px; font:600 10.5px/1 var(--font-m); letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); transition:color .4s ease; }
  .st i{ position:relative; width:12px; height:12px; border-radius:50%; background:#0c1730; border:1.5px solid rgba(158,227,255,.28); transition:background .4s ease,border-color .4s ease,box-shadow .4s ease,transform .4s ease; }
  .st.done{ color:var(--ink2); } .st.done i{ background:var(--b1); border-color:var(--b2); }
  .st.on{ color:var(--ink); } .st.on i{ background:#fff; border-color:#fff; box-shadow:0 0 14px 3px rgba(120,210,255,.9); transform:scale(1.15); }
  .link{ width:34px; height:2px; margin:0 -4px 20px; border-radius:2px; background:rgba(158,227,255,.16); position:relative; overflow:hidden; }
  .link::after{ content:""; position:absolute; inset:0; background:linear-gradient(90deg,var(--b1),var(--b2)); transform:scaleX(0); transform-origin:left; transition:transform .6s ease; }
  .link.fill::after{ transform:scaleX(1); }

  .bar{ position:relative; width:100%; height:7px; border-radius:99px; overflow:hidden; background:rgba(255,255,255,.06); border:1px solid rgba(168,209,255,.16); margin-top:2px; }
  .bar::after{ content:""; position:absolute; top:0; bottom:0; left:-40%; width:38%; border-radius:inherit; background:linear-gradient(90deg,transparent,rgba(77,166,255,.95),rgba(158,227,255,1),transparent); box-shadow:0 0 14px rgba(77,166,255,.8); }

  .ipl-status{ display:flex; align-items:center; gap:12px; width:100%; min-height:56px; margin-top:4px; padding:0 18px 0 16px; border-radius:18px; border:1px solid rgba(168,209,255,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02)); text-align:left; box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .ipl-dot{ position:relative; flex:none; width:9px; height:9px; border-radius:50%; background:var(--mint); box-shadow:0 0 12px rgba(52,224,192,.9); }
  .ipl-dot::after{ content:""; position:absolute; inset:0; border-radius:inherit; background:var(--mint); }
  .ipl-msg{ flex:1; min-width:0; font:500 12.5px/1.35 var(--font-m); letter-spacing:.02em; color:#eaf0f7; transition:opacity .25s ease,transform .25s ease; }
  .ipl-msg.out{ opacity:0; transform:translateY(4px); }
  .ipl-tag{ flex:none; display:flex; align-items:center; gap:6px; font:500 10px/1 var(--font-m); letter-spacing:.16em; color:#8e99a8; }
  .ipl-tag svg{ width:11px; height:11px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .fine{ margin-top:6px; font:500 10.5px/1.4 var(--font-m); letter-spacing:.12em; color:var(--ink3); text-transform:uppercase; }

  h1.error{ background:none; -webkit-text-fill-color:#ff8e9b; color:#ff8e9b; }
  a.btn{ display:inline-block; margin-top:8px; padding:13px 28px; background:linear-gradient(180deg,#1a58b8,#0d2f61); border:1px solid rgba(168,209,255,.5); color:#fff; border-radius:14px; text-decoration:none; font-weight:700; box-shadow:0 10px 28px rgba(47,107,255,.35); }

  /* ---------- motion (only when the device allows it) ---------- */
  @media (prefers-reduced-motion:no-preference){
    .aurora.a1{ animation:drift1 16s ease-in-out infinite alternate; }
    .aurora.a2{ animation:drift2 19s ease-in-out infinite alternate; }
    .aurora.a3{ animation:drift3 22s ease-in-out infinite alternate; }
    .floor i{ animation:floorMove 3.2s linear infinite; }
    .spark{ animation:rise var(--d,9s) linear infinite; animation-delay:var(--w,0s); }
      .brand .mark::after{ animation:shine 4.6s ease-in-out infinite; }
    .orb .halo{ animation:halo 3.4s ease-in-out infinite; }
    .orb .ring.r1{ animation:spin 3.2s linear infinite; }
    .orb .ring.r2{ animation:spin 5.4s linear infinite reverse; }
    .orb .ticks{ animation:spin 24s linear infinite; }
    .orb .sat.s1{ animation:spin 4.2s linear infinite; }
    .orb .sat.s2{ animation:spin 6.6s linear infinite reverse; }
    .orb .core .flow{ animation:flow 2.1s linear infinite; }
    .orb .core{ animation:breathe 3.4s ease-in-out infinite; }
    .bar::after{ animation:sweep 1.4s ease-in-out infinite; }
    .ipl-dot::after{ animation:iplPing 1.8s ease-out infinite; }
    .box > *{ animation:enter .8s cubic-bezier(.2,.8,.2,1) both; }
    .box > *:nth-child(2){ animation-delay:.08s } .box > *:nth-child(3){ animation-delay:.16s } .box > *:nth-child(4){ animation-delay:.24s }
    .box > *:nth-child(5){ animation-delay:.32s } .box > *:nth-child(6){ animation-delay:.4s } .box > *:nth-child(7){ animation-delay:.48s } .box > *:nth-child(8){ animation-delay:.56s }
  }
  @media (prefers-reduced-motion:reduce){ .ipl-msg,.st,.st i,.link::after{ transition:none; } .spark{ display:none; } }
  @keyframes shine{ 0%,58%{ transform:translateX(-140%) skewX(-20deg) } 100%{ transform:translateX(330%) skewX(-20deg) } }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  @keyframes flow{ to{ stroke-dashoffset:-200 } }
  @keyframes halo{ 0%,100%{ transform:scale(.92); opacity:.7 } 50%{ transform:scale(1.08); opacity:1 } }
  @keyframes breathe{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.035) } }
  @keyframes sweep{ to{ left:102% } }
  @keyframes iplPing{ 0%{ transform:scale(1); opacity:.55 } 100%{ transform:scale(2.6); opacity:0 } }
  @keyframes enter{ from{ opacity:0; transform:translateY(14px) } to{ opacity:1; transform:none } }
  @keyframes drift1{ to{ transform:translate3d(14vmax,10vmax,0) scale(1.12) } }
  @keyframes drift2{ to{ transform:translate3d(-16vmax,8vmax,0) scale(1.08) } }
  @keyframes drift3{ to{ transform:translate3d(12vmax,-8vmax,0) scale(1.15) } }
  @keyframes floorMove{ to{ transform:translateY(56px) } }
  @keyframes rise{ 0%{ transform:translate3d(0,0,0); opacity:0 } 12%{ opacity:.95 } 80%{ opacity:.7 } 100%{ transform:translate3d(var(--x,0px),-70vh,0); opacity:0 } }
  @media (max-width:340px){ .ipl-tag span{ display:none } h1{ font-size:22px } .brand .word{ font-size:19px } .brand .tag{ letter-spacing:.3em } .brand .tag u{ width:18px } .orb{ width:150px; height:150px } .orb .core{ width:90px; height:90px } }
  @media (max-height:660px){
    .box{ gap:10px } .brand{ margin:0 0 4px; gap:9px } .brand .mark{ width:42px; height:42px; border-radius:13px } .brand .word{ font-size:20px }
    .orb{ width:128px; height:128px; margin:0 } .orb .core{ width:80px; height:80px } .orb .core svg{ width:48px; height:24px }
    h1{ font-size:21px } p{ font-size:13.5px; line-height:1.55 } .fine{ display:none } .ipl-status{ min-height:48px; margin-top:0 } .st{ gap:6px }
  }
</style>
</head>
<body>

<div class="scene" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="floor"><i></i></div>
  <i class="spark" style="left:8%;bottom:10%;--x:18px;--d:9s;--w:-1s"></i><i class="spark" style="left:18%;bottom:6%;--x:-14px;--d:12s;--w:-5s"></i>
  <i class="spark" style="left:29%;bottom:14%;--x:22px;--d:10s;--w:-3s"></i><i class="spark" style="left:41%;bottom:4%;--x:-10px;--d:13s;--w:-8s"></i>
  <i class="spark" style="left:52%;bottom:12%;--x:16px;--d:9.5s;--w:-6s"></i><i class="spark" style="left:63%;bottom:7%;--x:-20px;--d:11s;--w:-2s"></i>
  <i class="spark" style="left:72%;bottom:16%;--x:12px;--d:12.5s;--w:-9s"></i><i class="spark" style="left:83%;bottom:5%;--x:-16px;--d:10.5s;--w:-4s"></i>
  <i class="spark" style="left:92%;bottom:11%;--x:10px;--d:9s;--w:-7s"></i><i class="spark" style="left:35%;bottom:2%;--x:-8px;--d:14s;--w:-10s"></i>
  <div class="vignette"></div>
</div>

<div class="box" id="box">
  <div class="brand" aria-hidden="true"><span class="word"><b>Infinity</b><i>Pips</i></span><span class="tag"><u></u>Apex Intelligence<u></u></span></div>

  <div class="orb" id="orb" aria-hidden="true">
    <div class="halo"></div>
    <div class="ticks"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="sat s1"><i></i></div>
    <div class="sat s2"><i></i></div>
    <div class="core">
      <svg viewBox="0 0 48 24">
        <defs><linearGradient id="flowg" x1="0" x2="1"><stop offset="0" stop-color="#4da6ff"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#9ee3ff"/></linearGradient></defs>
        <path class="base" d="M24 12C19 5 6 5 6 12s13 7 18 0 18-7 18 0-13 7-18 0Z"/>
        <path class="flow" pathLength="200" d="M24 12C19 5 6 5 6 12s13 7 18 0 18-7 18 0-13 7-18 0Z"/>
      </svg>
    </div>
  </div>

  <h1 id="title">Preparing Your Trading Workspace</h1>
  <p id="message">Please wait a moment while we complete your secure sign-in.</p>

  <div class="steps" id="steps" aria-hidden="true">
    <div class="st on"><i></i>Verify</div><span class="link"></span>
    <div class="st"><i></i>Secure</div><span class="link"></span>
    <div class="st"><i></i>Launch</div>
  </div>

  <div class="bar" id="spinner" role="progressbar" aria-label="Preparing workspace"></div>
  <div class="ipl-status"><span class="ipl-dot" aria-hidden="true"></span><span class="ipl-msg" id="iplMsg" aria-live="off">Verifying access...</span><span class="ipl-tag" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>SECURE</span></span></div>
  <div class="fine" id="fine">Encrypted &middot; Private &middot; Instant</div>
</div>

<script>
(function(){
  var MSGS=['Verifying access...','Initializing your workspace...','Checking...'],idx=0,tm=null,sw=null;
  function iplStop(){if(tm){clearInterval(tm);tm=null;}if(sw){clearTimeout(sw);sw=null;}}
  function iplSteps(n){var st=document.querySelectorAll('#steps .st'),ln=document.querySelectorAll('#steps .link');for(var k=0;k<st.length;k++){st[k].className='st'+(k<n?' done':(k===n?' on':''));}for(var m=0;m<ln.length;m++){ln[m].className='link'+(m<n?' fill':'');}}
  function iplStart(){var el=document.getElementById('iplMsg');if(!el)return;iplStop();idx=0;iplSteps(0);el.className='ipl-msg';el.textContent=MSGS[0];tm=setInterval(function(){idx=(idx+1)%MSGS.length;iplSteps(idx);el.classList.add('out');sw=setTimeout(function(){el.textContent=MSGS[idx];el.classList.remove('out');},250);},2200);}
  iplStart();
  var box = document.getElementById('box');
  var spinner = document.getElementById('spinner');
  var title = document.getElementById('title');
  var message = document.getElementById('message');

  function showError(msg){
    iplStop();
    var st = document.querySelector('.ipl-status'); if (st) st.style.display = 'none';
    var stp = document.getElementById('steps'); if (stp) stp.style.display = 'none';
    var fn = document.getElementById('fine'); if (fn) fn.style.display = 'none';
    spinner.style.display = 'none';
    document.getElementById('orb').style.display = 'none';
    title.textContent = 'Connection interrupted';
    title.className = 'error';
    message.textContent = msg;
    var link = document.createElement('a');
    link.className = 'btn';
    link.href = '/';
    link.textContent = 'Back to portal';
    box.appendChild(link);
  }

  function showSuccess(slot){
    // No success screen: hand straight back to the portal. replace() keeps this
    // callback page out of the browser history so Back never returns to it.
    var target = sessionStorage.getItem('deriv_post_auth_target') || 'portal';
    sessionStorage.removeItem('deriv_post_auth_target');
    var destination = target === 'robot' ? '/Ariana.html' : '/';
    iplStop();
    window.location.replace(destination + '?deriv_connected=1&slot=' + slot);
  }

  var params = new URLSearchParams(window.location.search);
  var error = params.get('error');
  var code = params.get('code');
  var state = params.get('state');

  if (error){
    showError(params.get('error_description') || error);
    return;
  }

  if (!code || !state){
    showError('Missing authorization code from Deriv.');
    return;
  }

  // The login was started for one of four separate Deriv apps ("slots").
  // The slot travels inside `state` (e.g. "s2.<random>") because all four
  // apps share this one callback URL. Each slot keeps its own state,
  // verifier and token, so finishing one app never overwrites another.
  var slotMatch = /^s([1-8])\./.exec(state);
  if (!slotMatch){
    showError('Security check failed (unknown app). Please try logging in again.');
    return;
  }
  var slot = Number(slotMatch[1]);

  var storedState = sessionStorage.getItem('deriv_oauth_state_' + slot);
  var codeVerifier = sessionStorage.getItem('deriv_code_verifier_' + slot);

  if (!storedState || state !== storedState){
    showError('Security check failed (state mismatch). Please try logging in again.');
    return;
  }

  if (!codeVerifier){
    showError('Your sign-in session expired. Please return to the portal and try again.');
    return;
  }

  // The actual code-for-token exchange must happen server-side (Deriv's own
  // docs are explicit about this), so we hand it off to a Netlify Function
  // rather than calling Deriv's token endpoint directly from this page.
  fetch('/.netlify/functions/deriv-token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: code,
      code_verifier: codeVerifier,
      redirect_uri: window.location.origin + '/callback',
      slot: slot
    })
  })
  .then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(data){
      return { ok: res.ok, status: res.status, data: data };
    });
  })
  .then(function(result){
    sessionStorage.removeItem('deriv_oauth_state_' + slot);
    sessionStorage.removeItem('deriv_code_verifier_' + slot);

    if (!result.ok){
      if (result.status === 403 && result.data && result.data.error === 'not_authorized'){
        showError('This Deriv account is not authorized to use this app.');
      } else if (result.status === 409 && result.data && result.data.error === 'account_conflict'){
        showError('This Deriv account is already linked to a different account here. Please use the account you originally connected with.');
      } else if (result.data && result.data.message){
        showError(result.data.message);
      } else {
        showError('Could not complete login (HTTP ' + result.status + '). Please try again.');
      }
      return;
    }

    // The server keeps the Deriv credentials (encrypted). The browser is told only that this app is connected.
    if (result.data.connected){
      if (result.data.loginid){ sessionStorage.setItem('deriv_loginid', result.data.loginid); }
      showSuccess(slot);
    } else {
      showError('The connection could not be completed. Please try again.');
    }
  })
  .catch(function(err){
    console.error(err);
    showError(err && err.message ? err.message : 'Could not complete login. Please try again.');
  });
})();
</script>
</body>
</html>
