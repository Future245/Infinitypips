<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infinity Pips</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{ box-sizing:border-box; color-scheme:dark; }
  *{ box-sizing:inherit; margin:0; padding:0; }
  body{
    font-family:-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;
    background:radial-gradient(120% 70% at 50% 0%,#0b1a33 0%,#000 62%);
    color:#f5f7fa;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .box{ max-width:360px; display:flex; flex-direction:column; align-items:center; gap:16px; }
  .orb{ position:relative; width:88px; height:88px; display:grid; place-items:center; margin-bottom:4px; }
  .orb i{ position:absolute; inset:0; border-radius:50%; border:1.5px solid rgba(230,241,255,.35); box-shadow:0 0 26px rgba(77,166,255,.35), inset 0 0 20px rgba(77,166,255,.18); }
  .orb i+i{ inset:12px; border-color:rgba(77,166,255,.45); }
  .orb svg{ position:relative; width:46px; height:23px; fill:none; stroke:#e6f1ff; stroke-width:2.6; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 8px rgba(77,166,255,.9)); }
  h1{ font-size:21px; line-height:1.25; font-weight:800; letter-spacing:-.01em; }
  p{ color:#c3ccd9; font-size:14.5px; line-height:1.6; }
  .bar{ position:relative; width:100%; height:7px; border-radius:99px; overflow:hidden; background:rgba(255,255,255,.07); border:1px solid rgba(168,209,255,.16); margin-top:4px; }
  .bar::after{ content:""; position:absolute; top:0; bottom:0; left:-40%; width:38%; background:linear-gradient(90deg,transparent,rgba(77,166,255,.95),transparent); }
  @media (prefers-reduced-motion:no-preference){
    .orb i{ animation:pulse 2.8s ease-in-out infinite; } .orb i+i{ animation-delay:-1.4s; }
    .bar::after{ animation:sweep 1.4s ease-in-out infinite; }
  }
  @keyframes pulse{ 0%,100%{ transform:scale(.94); opacity:.65; } 50%{ transform:scale(1.04); opacity:1; } }
  @keyframes sweep{ to{ left:102%; } }
  h1.error{ color:#ff8e9b; }
  a.btn{
    display:inline-block;
    margin-top:6px;
    padding:12px 24px;
    background:linear-gradient(180deg,#14448c,#0d2f61);
    border:1px solid rgba(168,209,255,.45);
    color:#fff;
    border-radius:12px;
    text-decoration:none;
    font-weight:700;
  }

 .ipl-status{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin-top:6px;padding:0 18px 0 16px;border-radius:18px;border:1px solid rgba(168,209,255,.16);background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));text-align:left}
 .ipl-dot{position:relative;flex:none;width:9px;height:9px;border-radius:50%;background:#e6f1ff;box-shadow:0 0 10px rgba(230,241,255,.8)}
 .ipl-dot::after{content:"";position:absolute;inset:0;border-radius:inherit;background:#e6f1ff}
 .ipl-msg{flex:1;min-width:0;font:500 12.5px/1.35 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;letter-spacing:.02em;color:#eaf0f7;transition:opacity .25s ease,transform .25s ease}
 .ipl-msg.out{opacity:0;transform:translateY(4px)}
 .ipl-tag{flex:none;font:500 10px/1 'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;letter-spacing:.16em;color:#8e99a8}
@media (prefers-reduced-motion:no-preference){ .ipl-dot::after{animation:iplPing 1.8s ease-out infinite}}
@media (prefers-reduced-motion:reduce){ .ipl-msg{transition:none}}
@media (max-width:340px){ .ipl-tag{display:none}}
@keyframes iplPing{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}
</style>
</head>
<body>

<div class="box" id="box">
  <div class="orb" id="orb" aria-hidden="true"><i></i><i></i><svg viewBox="0 0 48 24"><path d="M24 12C19 5 6 5 6 12s13 7 18 0 18-7 18 0-13 7-18 0Z"/></svg></div>
  <h1 id="title">Preparing Your Trading Workspace</h1>
  <p id="message">Please wait a moment while we complete your secure sign-in.</p>
  <div class="bar" id="spinner" role="progressbar" aria-label="Preparing workspace"></div>
  <div class="ipl-status"><span class="ipl-dot" aria-hidden="true"></span><span class="ipl-msg" id="iplMsg" aria-live="off">Verifying access...</span><span class="ipl-tag" aria-hidden="true">SECURE</span></div>
</div>

<script>
(function(){
  var MSGS=['Verifying access...','Initializing your workspace...','Checking...'],idx=0,tm=null,sw=null;
  function iplStop(){if(tm){clearInterval(tm);tm=null;}if(sw){clearTimeout(sw);sw=null;}}
  function iplStart(){var el=document.getElementById('iplMsg');if(!el)return;iplStop();idx=0;el.className='ipl-msg';el.textContent=MSGS[0];tm=setInterval(function(){idx=(idx+1)%MSGS.length;el.classList.add('out');sw=setTimeout(function(){el.textContent=MSGS[idx];el.classList.remove('out');},250);},2200);}
  iplStart();
  var box = document.getElementById('box');
  var spinner = document.getElementById('spinner');
  var title = document.getElementById('title');
  var message = document.getElementById('message');

  function showError(msg){
    iplStop();
    var st = document.querySelector('.ipl-status'); if (st) st.style.display = 'none';
    spinner.style.display = 'none';
    document.getElementById('orb').style.display = 'none';
    title.textContent = 'Connection interrupted';
    title.className = 'error';
    message.textContent = msg;
    var link = document.createElement('a');
    link.className = 'btn';
    link.href = '/';
    link.textContent = 'Back to portal';
    box.appendChild(link);
  }

  function showSuccess(slot){
    // No success screen: hand straight back to the portal. replace() keeps this
    // callback page out of the browser history so Back never returns to it.
    var target = sessionStorage.getItem('deriv_post_auth_target') || 'portal';
    sessionStorage.removeItem('deriv_post_auth_target');
    var destination = target === 'robot' ? '/Ariana.html' : '/';
    iplStop();
    window.location.replace(destination + '?deriv_connected=1&slot=' + slot);
  }

  var params = new URLSearchParams(window.location.search);
  var error = params.get('error');
  var code = params.get('code');
  var state = params.get('state');

  if (error){
    showError(params.get('error_description') || error);
    return;
  }

  if (!code || !state){
    showError('Missing authorization code from Deriv.');
    return;
  }

  // The login was started for one of four separate Deriv apps ("slots").
  // The slot travels inside `state` (e.g. "s2.<random>") because all four
  // apps share this one callback URL. Each slot keeps its own state,
  // verifier and token, so finishing one app never overwrites another.
  var slotMatch = /^s([1-8])\./.exec(state);
  if (!slotMatch){
    showError('Security check failed (unknown app). Please try logging in again.');
    return;
  }
  var slot = Number(slotMatch[1]);

  var storedState = sessionStorage.getItem('deriv_oauth_state_' + slot);
  var codeVerifier = sessionStorage.getItem('deriv_code_verifier_' + slot);

  if (!storedState || state !== storedState){
    showError('Security check failed (state mismatch). Please try logging in again.');
    return;
  }

  if (!codeVerifier){
    showError('Your sign-in session expired. Please return to the portal and try again.');
    return;
  }

  // The actual code-for-token exchange must happen server-side (Deriv's own
  // docs are explicit about this), so we hand it off to a Netlify Function
  // rather than calling Deriv's token endpoint directly from this page.
  fetch('/.netlify/functions/deriv-token', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      code: code,
      code_verifier: codeVerifier,
      redirect_uri: window.location.origin + '/callback',
      slot: slot
    })
  })
  .then(function(res){
    return res.json().catch(function(){ return {}; }).then(function(data){
      return { ok: res.ok, status: res.status, data: data };
    });
  })
  .then(function(result){
    sessionStorage.removeItem('deriv_oauth_state_' + slot);
    sessionStorage.removeItem('deriv_code_verifier_' + slot);

    if (!result.ok){
      if (result.status === 403 && result.data && result.data.error === 'not_authorized'){
        showError('This Deriv account is not authorized to use this app.');
      } else if (result.status === 409 && result.data && result.data.error === 'account_conflict'){
        showError('This Deriv account is already linked to a different account here. Please use the account you originally connected with.');
      } else if (result.data && result.data.message){
        showError(result.data.message);
      } else {
        showError('Could not complete login (HTTP ' + result.status + '). Please try again.');
      }
      return;
    }

    // The server keeps the Deriv credentials (encrypted). The browser is told only that this app is connected.
    if (result.data.connected){
      if (result.data.loginid){ sessionStorage.setItem('deriv_loginid', result.data.loginid); }
      showSuccess(slot);
    } else {
      showError('The connection could not be completed. Please try again.');
    }
  })
  .catch(function(err){
    console.error(err);
    showError(err && err.message ? err.message : 'Could not complete login. Please try again.');
  });
})();
</script>
</body>
</html>
